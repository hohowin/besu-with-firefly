apiVersion: core.paladin.io/v1alpha1
kind: SmartContractDeployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: operator-go
  name: noto-factory-proxy
spec:
  abiJSON: |-
    [
      {
        "inputs": [
          {
            "internalType": "address",
            "name": "implementation",
            "type": "address"
          },
          {
            "internalType": "bytes",
            "name": "_data",
            "type": "bytes"
          }
        ],
        "outputs": null,
        "stateMutability": "payable",
        "type": "constructor"
      },
      {
        "inputs": [
          {
            "internalType": "address",
            "name": "target",
            "type": "address"
          }
        ],
        "name": "AddressEmptyCode",
        "outputs": null,
        "type": "error"
      },
      {
        "inputs": [
          {
            "internalType": "address",
            "name": "implementation",
            "type": "address"
          }
        ],
        "name": "ERC1967InvalidImplementation",
        "outputs": null,
        "type": "error"
      },
      {
        "inputs": [],
        "name": "ERC1967NonPayable",
        "outputs": null,
        "type": "error"
      },
      {
        "inputs": [],
        "name": "FailedCall",
        "outputs": null,
        "type": "error"
      },
      {
        "inputs": [
          {
            "indexed": true,
            "internalType": "address",
            "name": "implementation",
            "type": "address"
          }
        ],
        "name": "Upgraded",
        "outputs": null,
        "type": "event"
      },
      {
        "inputs": null,
        "outputs": null,
        "stateMutability": "payable",
        "type": "fallback"
      }
    ]
  bytecode: 
  from: noto_factory_proxy.operator
  node: node1
  paramsJSON: |-
    [
      "{{index .status.resolvedContractAddresses \"noto-factory\"}}",
      "{{printf \"0xc4d66de8000000000000000000000000%s\" (trimPrefix \"0x\" (index .status.resolvedContractAddresses \"noto\"))}}"
    ]
  requiredContractDeployments:
  - noto-factory
  - noto
  txType: public
status: {}
