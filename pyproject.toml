[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "besu-with-firefly"
version = "0.0.0"
description = "Besu QBFT network with FireFly and Paladin: stack tooling and a FireFly client"
requires-python = ">=3.11"
dependencies = [
    "eth-abi>=5",
    "eth-account>=0.13",
    "eth-utils>=5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
besu-ff = "src.adapters.ff_cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Integration tests need Docker and a running stack. They are skipped unless selected with -m integration.
addopts = "-m 'not integration'"
markers = [
    "integration: needs Docker and a live stack (run with: pytest -m integration)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Not our code: reference material, Phase 0 evidence, installed third-party skills.
extend-exclude = ["spike", ".venv", ".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
# Not our code: reference material, Phase 0 evidence, installed third-party skills.
exclude = ["^spike/", "^\\.venv/", "^\\.agents/", "^\\.claude/"]
