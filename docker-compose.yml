# Besu QBFT network: 4 validators (no published ports) and, two RPC nodes (Anson 8545/8546, Beatrice 8555/8556).
# Genesis, validator keys and static-nodes.json come from `python scripts/stack.py init`
# and are committed under network-config/ (demo keys only, plan D-10).
name: besu-with-firefly

x-besu: &besu
  image: hyperledger/besu:26.8.1
  networks:
    - besu

services:
  besu-validator-1:
    <<: *besu
    container_name: besu-validator-1
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.11
      - --p2p-port=30303
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/validator-keys/validator-1/key:/config/key:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.11

  besu-validator-2:
    <<: *besu
    container_name: besu-validator-2
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.12
      - --p2p-port=30303
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/validator-keys/validator-2/key:/config/key:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.12

  besu-validator-3:
    <<: *besu
    container_name: besu-validator-3
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.13
      - --p2p-port=30303
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/validator-keys/validator-3/key:/config/key:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.13

  besu-validator-4:
    <<: *besu
    container_name: besu-validator-4
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.14
      - --p2p-port=30303
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/validator-keys/validator-4/key:/config/key:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.14

  # RPC nodes do not validate (no --node-private-key-file). They dial the validators
  # through static-nodes.json and serve HTTP and WS RPC to the host.
  besu-rpc-anson:
    <<: *besu
    container_name: besu-rpc-anson
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.21
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,QBFT,ADMIN
    ports:
      - "8545:8545"
      - "8546:8546"
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.21

  besu-rpc-beatrice:
    <<: *besu
    container_name: besu-rpc-beatrice
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.22
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,QBFT,ADMIN
    ports:
      - "8555:8545"
      - "8556:8546"
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.22

networks:
  besu:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
