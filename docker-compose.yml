# Besu QBFT network (1 validator with no published ports, 1 RPC node: 8545/8546)
# plus FireFly in gateway mode (Postgres, signer, evmconnect, core; only core's 5000 is published).
# Genesis, validator keys and static-nodes.json come from `python scripts/stack.py init`
# and are committed under network-config/ (demo keys only, plan D-10).
name: besu-with-firefly

# Besu's own healthcheck is `[ -f /tmp/pid ]` with a 1 second timeout and a 5 second start period.
# With many containers starting at once that times out and the container turns `unhealthy`, which
# aborts `docker compose up` for anything that depends on it. Same check, patient limits.
x-besu: &besu
  image: hyperledger/besu:26.8.1
  healthcheck:
    test: ["CMD-SHELL", "bash -c '[ -f /tmp/pid ]'"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 60s
  networks:
    - besu

services:
  besu-validator-1:
    <<: *besu
    container_name: besu-validator-1
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.11
      - --p2p-port=30303
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/validator-keys/validator-1/key:/config/key:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.11

  # The RPC node does not validate (no --node-private-key-file). It dials the validator
  # through static-nodes.json and serves HTTP and WS RPC to the host.
  besu-rpc-anson:
    <<: *besu
    container_name: besu-rpc-anson
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.21
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,QBFT,ADMIN
    ports:
      - "8545:8545"
      - "8546:8546"
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.21

  # FireFly, gateway mode (plan D-02, D-03). Config, keys and keystores are generated by
  # `python scripts/stack.py init` under network-config/firefly/. Images pinned as in the spike.
  firefly-postgres:
    image: postgres:16-alpine
    container_name: firefly-postgres
    environment:
      POSTGRES_PASSWORD: f1refly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - besu

  firefly-signer:
    image: ghcr.io/hyperledger-firefly/signer@sha256:412236dfab0416ae3d60f4fecb311b067664a9dd4f16073856eb79a25f4c532f
    container_name: firefly-signer
    user: root
    volumes:
      - ./network-config/firefly/signer.yml:/etc/firefly/firefly.ffsigner.yaml:ro
      - ./network-config/firefly/signer-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://localhost:8545 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      besu-rpc-anson:
        condition: service_healthy
    networks:
      - besu

  firefly-evmconnect:
    image: ghcr.io/hyperledger-firefly/evmconnect@sha256:ca6e3860c784477cd800bcbf00506310a31992468bd5b2c1f4bd2a1317d2b03b
    container_name: firefly-evmconnect
    command: -f /evmconnect/config.yaml
    volumes:
      - ./network-config/firefly/evmconnect.yml:/evmconnect/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5008/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      firefly-signer:
        condition: service_healthy
    networks:
      - besu

  firefly-core:
    image: ghcr.io/hyperledger-firefly/firefly@sha256:d321bcd8c567430498b7e330e075f97b9aa1888e166c76a95b4b2df161b105b8
    container_name: firefly-core
    volumes:
      - ./network-config/firefly/core.yml:/etc/firefly/firefly.core.yml:ro
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/v1/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      firefly-postgres:
        condition: service_healthy
      firefly-evmconnect:
        condition: service_healthy
    networks:
      - besu

networks:
  besu:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
