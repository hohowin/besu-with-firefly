# Besu QBFT network (1 validator with no published ports, 1 RPC node: 8545/8546)
# plus FireFly in gateway mode (Postgres, signer, evmconnect, core; only core's 5000 is published)
# and Paladin (Postgres and three nodes; their HTTP RPC ports 8548, 8648 and 8748 are published).
# Genesis, validator keys and static-nodes.json come from `python scripts/stack.py init`
# and are committed under network-config/ (demo keys only, plan D-10).
name: besu-with-firefly

# Besu's own healthcheck is `[ -f /tmp/pid ]` with a 1 second timeout and a 5 second start period.
# With many containers starting at once that times out and the container turns `unhealthy`, which
# aborts `docker compose up` for anything that depends on it. Same check, patient limits.
x-besu: &besu
  image: hyperledger/besu:26.8.1
  healthcheck:
    test: ["CMD-SHELL", "bash -c '[ -f /tmp/pid ]'"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 60s
  networks:
    - besu

# Paladin nodes share this. The image runs as uid 1001 and needs /app/jna writable AND executable
# (a Docker tmpfs is noexec by default and the node dies with "failed to map segment").
x-paladin: &paladin
  image: lfdecentralizedtrust/paladin:v1.0.0
  command: ["/app/config/pldconf.paladin.yaml", "engine", "--logtostderr=true", "--v=4"]
  tmpfs:
    - /app/jna:exec,mode=1777
  healthcheck:
    test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"transport_nodeName\",\"params\":[]}' http://localhost:8548 | grep -q result"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 60s
  depends_on:
    paladin-seed:
      condition: service_completed_successfully
    paladin-postgres:
      condition: service_healthy
    besu-rpc-anson:
      condition: service_healthy
  networks:
    - besu

services:
  besu-validator-1:
    <<: *besu
    container_name: besu-validator-1
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.11
      - --p2p-port=30303
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/validator-keys/validator-1/key:/config/key:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.11

  # The RPC node does not validate (no --node-private-key-file). It dials the validator
  # through static-nodes.json and serves HTTP and WS RPC to the host.
  besu-rpc-anson:
    <<: *besu
    container_name: besu-rpc-anson
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/config/genesis.json
      - --min-gas-price=0
      - --host-allowlist=*
      - --p2p-host=172.28.0.21
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,WEB3,QBFT,ADMIN
    ports:
      - "8545:8545"
      - "8546:8546"
    volumes:
      - ./network-config/genesis.json:/config/genesis.json:ro
      - ./network-config/static-nodes.json:/opt/besu/data/static-nodes.json:ro
    networks:
      besu:
        ipv4_address: 172.28.0.21

  # FireFly, gateway mode (plan D-02, D-03). Config, keys and keystores are generated by
  # `python scripts/stack.py init` under network-config/firefly/. Images pinned as in the spike.
  firefly-postgres:
    image: postgres:16-alpine
    container_name: firefly-postgres
    environment:
      POSTGRES_PASSWORD: f1refly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - besu

  firefly-signer:
    image: ghcr.io/hyperledger-firefly/signer@sha256:412236dfab0416ae3d60f4fecb311b067664a9dd4f16073856eb79a25f4c532f
    container_name: firefly-signer
    user: root
    volumes:
      - ./network-config/firefly/signer.yml:/etc/firefly/firefly.ffsigner.yaml:ro
      - ./network-config/firefly/signer-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://localhost:8545 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      besu-rpc-anson:
        condition: service_healthy
    networks:
      - besu

  firefly-evmconnect:
    image: ghcr.io/hyperledger-firefly/evmconnect@sha256:ca6e3860c784477cd800bcbf00506310a31992468bd5b2c1f4bd2a1317d2b03b
    container_name: firefly-evmconnect
    command: -f /evmconnect/config.yaml
    volumes:
      - ./network-config/firefly/evmconnect.yml:/evmconnect/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5008/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      firefly-signer:
        condition: service_healthy
    networks:
      - besu

  firefly-core:
    image: ghcr.io/hyperledger-firefly/firefly@sha256:d321bcd8c567430498b7e330e075f97b9aa1888e166c76a95b4b2df161b105b8
    container_name: firefly-core
    volumes:
      - ./network-config/firefly/core.yml:/etc/firefly/firefly.core.yml:ro
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/v1/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      firefly-postgres:
        condition: service_healthy
      firefly-evmconnect:
        condition: service_healthy
    networks:
      - besu

  # Paladin (plan D-05, D-09): three nodes (node1 notary and registry admin, node2 Anson, node3
  # Beatrice) and one Postgres with a database per node. Base configs, certificates and the
  # Postgres init script are generated by `python scripts/stack.py init` under
  # network-config/paladin/. The nodes read their config from paladin-runtime/ (gitignored),
  # which `deploy` extends with the Noto domain.
  #
  # paladin-seed fills paladin-runtime/ from the base configs, so a fresh clone needs nothing before
  # `docker compose up` (`stack.py up` does the same copy). A config that is already there is kept:
  # once `deploy` has written the final one it must not be put back to the base. It exits when done.
  paladin-seed:
    image: alpine:3.20
    container_name: paladin-seed
    restart: "no"
    volumes:
      - ./network-config/paladin:/source:ro
      - ./paladin-runtime:/runtime
    command:
      - sh
      - -ec
      - |
        for node in node1 node2 node3; do
          mkdir -p "/runtime/$$node"
          if [ -f "/runtime/$$node/pldconf.paladin.yaml" ]; then
            echo "$$node: config already there, kept"
          else
            cp "/source/$$node/pldconf.paladin.yaml" "/runtime/$$node/pldconf.paladin.yaml"
            echo "$$node: base config copied"
          fi
        done
    networks:
      - besu

  paladin-postgres:
    image: postgres:17-alpine
    container_name: paladin-postgres
    environment:
      POSTGRES_PASSWORD: paladin-demo-pw
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./network-config/paladin/postgres-init:/docker-entrypoint-initdb.d:ro
      - paladin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - besu

  paladin-node1:
    <<: *paladin
    container_name: paladin-node1
    volumes:
      - ./paladin-runtime/node1:/app/config:ro
      - ./network-config/paladin/node1/certs:/certs:ro
    ports:
      - "8548:8548"

  paladin-node2:
    <<: *paladin
    container_name: paladin-node2
    volumes:
      - ./paladin-runtime/node2:/app/config:ro
      - ./network-config/paladin/node2/certs:/certs:ro
    ports:
      - "8648:8548"

  paladin-node3:
    <<: *paladin
    container_name: paladin-node3
    volumes:
      - ./paladin-runtime/node3:/app/config:ro
      - ./network-config/paladin/node3/certs:/certs:ro
    ports:
      - "8748:8548"

volumes:
  paladin-postgres-data:

networks:
  besu:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
